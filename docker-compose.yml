# Prometheus + Grafana. La APLICACIÓN corre en tu equipo:  HOST=0.0.0.0 python -m app
# Prometheus la lee a través de host.docker.internal.  Grafana: http://localhost:3000/d/estandares
services:
  prometheus:
    image: prom/prometheus:v3.5.5
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"     # necesario en Linux; en Docker Desktop ya existe
  grafana:
    image: grafana/grafana:12.4.11
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin         # solo laboratorio: cámbiala fuera del entorno local
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
